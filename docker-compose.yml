services:
  db:
    image: postgres:16-alpine
    container_name: app_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "13306:5432" # Внешний 13306, внутренний 5432 (Postgres)
    volumes:
      - postgresdata:/var/lib/postgresql/data # Переименовали том
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: app_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: ${FLASK_APP}
      FLASK_ENV: ${FLASK_ENV}
      PORT: ${PORT}
      SERVICE_NAME: ${SERVICE_NAME}
      SERVICE_VERSION: ${SERVICE_VERSION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT} # Внутри контейнера это будет 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_MAX_CONNS: ${DB_MAX_CONNS}
      DB_CONN_RETRIES: ${DB_CONN_RETRIES}
      DB_CONN_RETRY_DELAY: ${DB_CONN_RETRY_DELAY}
    ports:
      - "${PORT}:5000"

volumes:
  postgresdata: # Новый том для Postgres